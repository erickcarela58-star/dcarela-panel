  <script>
  try {
    var p = localStorage.getItem('dcarela-mm-palette') || 'sapphire';
    document.documentElement.dataset.palette = p;
    var c = localStorage.getItem('dcarela-mm-accent');
    if (p === 'custom' && /^#[0-9a-f]{6}$/i.test(c || '')) {
      document.documentElement.style.setProperty('--v3526-accent-custom', c);
    }
    var g = JSON.parse(localStorage.getItem('dcarela-mm-glass-config') || 'null');
    if (g && typeof g === 'object') {
      if (g.visualStyle) document.documentElement.dataset.visualStyle = g.visualStyle === 'solid' ? 'solid' : 'glass';
      if (g.solidBg) {
        document.documentElement.dataset.solidBg = g.solidBg;
        var spMap = {
          default: ['#090b10', '#121620', '#f3f5f8', '#ffffff'],
          midnight: ['#070b14', '#101829', '#eef3fb', '#ffffff'],
          slate: ['#0e131b', '#18202c', '#f1f5f9', '#ffffff'],
          emerald: ['#071310', '#0f211c', '#eff8f4', '#ffffff'],
          amethyst: ['#100a19', '#1b1229', '#f6f2fc', '#ffffff'],
          pureblack: ['#000000', '#101014', '#f8fafc', '#ffffff']
        };
        var sp = spMap[g.solidBg] || spMap.default;
        var isDarkPref = !/light/i.test(localStorage.getItem('dcarela-finanzas-theme') || '');
        document.documentElement.style.setProperty('--v3526-solid-bg-custom', isDarkPref ? sp[0] : sp[2]);
        document.documentElement.style.setProperty('--v3526-solid-surface-custom', isDarkPref ? sp[1] : sp[3]);
      }
      if (g.orbMode) document.documentElement.dataset.orbMode = g.orbMode;
      if (g.orbColors && Array.isArray(g.orbColors)) {
        g.orbColors.forEach(function(col, idx){ if (/^#[0-9a-f]{6}$/i.test(col || '')) document.documentElement.style.setProperty('--v3526-orb-custom-' + (idx + 1), col); });
      }
      if (Number.isFinite(Number(g.orbBlur))) document.documentElement.style.setProperty('--v3526-orb-blur', Number(g.orbBlur) + 'px');
      if (Number.isFinite(Number(g.orbOpacity))) document.documentElement.style.setProperty('--v3526-orb-alpha', String(Number(g.orbOpacity) / 100));
      if (Number.isFinite(Number(g.orbScale))) document.documentElement.style.setProperty('--v3526-orb-scale', String(Number(g.orbScale) / 100));
      if (Number.isFinite(Number(g.orbSpeed))) document.documentElement.style.setProperty('--v3526-orb-speed', String(Number(g.orbSpeed)));
      if (Number.isFinite(Number(g.glassAlpha))) document.documentElement.style.setProperty('--v3526-glass-alpha', String(Number(g.glassAlpha) / 100));
    }
  } catch (_) {}
  </script>
