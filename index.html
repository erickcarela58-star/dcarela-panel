<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="robots" content="noindex,nofollow">
  <title>D' Carela Compufoto | Panel Movil</title>
  <script>
    (() => {
      const target = new URL("./mobile/", location.href);
      const currentParams = new URLSearchParams(location.search);
      currentParams.forEach((val, key) => target.searchParams.set(key, val));
      target.hash = location.hash;
      location.replace(target.href);
    })();
  </script>
</head>
<body>
  <p>Abriendo el panel móvil… <a href="./mobile/">Continuar</a></p>
</body>
</html>
