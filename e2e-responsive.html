<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>D'Carela · Arnés responsive E2E</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #d4d4d8; }
    body { padding: 12px; }
    iframe {
      display: block;
      width: 430px;
      height: 844px;
      border: 0;
      background: white;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .24);
    }
  </style>
</head>
<body>
  <iframe
    id="responsivePanel"
    title="Panel oficial responsive 430x844"
    src="./?e2e=responsive-430x844#resumen"
  ></iframe>
  <script>
    const route = new URLSearchParams(location.search).get("route") || "resumen";
    if (/^[a-z0-9-]+$/.test(route) && route !== "resumen") {
      document.getElementById("responsivePanel").src = `./?e2e=responsive-430x844#${route}`;
    }
  </script>
</body>
</html>
